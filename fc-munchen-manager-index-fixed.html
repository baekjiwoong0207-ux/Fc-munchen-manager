<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#65162a">
<title>FC München Manager</title>
<style>
:root{--red:#65162a;--red2:#8d233d;--gold:#d8b45a;--cream:#f7f1e5;--ink:#171316;--muted:#776f73;--card:#fff;--line:#eadfe1}
*{box-sizing:border-box}body{margin:0;background:#f3eeee;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}
#app{max-width:560px;margin:auto;min-height:100vh;background:#f7f5f4;padding-bottom:78px}.splash{position:fixed;inset:0;background:linear-gradient(145deg,#3e0d1a,#761c34);display:grid;place-items:center;z-index:50;color:white}.splash.hide{display:none}.crest{width:112px;height:112px;border:4px solid var(--gold);border-radius:50%;display:grid;place-items:center;background:#69182c;box-shadow:0 0 45px #0006}.crest b{font-family:Georgia;font-size:29px;color:var(--gold);letter-spacing:-2px}.splash p{text-align:center;letter-spacing:3px;font-weight:700}.top{padding:20px 18px 10px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mini{width:42px;height:42px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-weight:900}.brand h1{font:700 20px Georgia;margin:0}.brand small{opacity:.75}.content{padding:14px 16px}.hero{height:240px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(160deg,#4d1022,#a04457 50%,#24151a)}.hero:before{content:"POP ARENA";position:absolute;left:18px;bottom:18px;font:700 38px Georgia;color:#fff8;letter-spacing:2px}.hero:after{content:"60,000 SEATS";position:absolute;right:18px;top:18px;color:#fff;border:1px solid #fff7;padding:7px 10px;border-radius:20px;font-size:11px}.heroText{position:absolute;z-index:2;left:20px;top:22px;color:white}.heroText strong{font:700 34px Georgia;display:block}.heroText span{color:#f0d48b;letter-spacing:3px}.section{margin-top:18px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectionTitle h2{font-size:18px;margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px;box-shadow:0 4px 14px #35111a08}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:68px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20}.nav button{flex:1;border:0;background:none;color:#756b70;font-size:11px}.nav button.active{color:var(--red);font-weight:800}.nav span{display:block;font-size:21px;margin-bottom:2px}.player{display:flex;align-items:center;gap:12px;min-height:82px}.playerPic{width:58px;height:58px;border-radius:14px;background:linear-gradient(145deg,#8d233d,#32111b);display:grid;place-items:center;color:#f5d88c;font-weight:900;font-size:17px}.playerInfo{flex:1}.playerInfo b{display:block}.playerInfo small{color:var(--muted)}.num{font-weight:900;color:var(--red)}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;margin-bottom:14px;outline:none}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#f1e4e7;color:var(--red);font-size:11px;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.bigMoney{font:700 31px Georgia;color:var(--red)}.green{color:#16804c}.red{color:#b22942}.newsMain{padding:22px;background:linear-gradient(145deg,#4b1020,#7e2940);color:#fff;border-radius:20px}.newsMain h2{margin:8px 0;font:700 24px Georgia}.textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:13px;padding:12px;resize:vertical}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--red);color:white;font-weight:800}.btn.gold{background:var(--gold);color:#24170d}.btn.light{background:#f0e5e7;color:var(--red)}.btn.danger{background:#f8e4e7;color:#a51f38}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profile{text-align:center}.profilePic{width:150px;height:150px;border-radius:22px;margin:10px auto 18px;background:linear-gradient(145deg,#8d233d,#291018);display:grid;place-items:center;color:#f0d38b;font:700 32px Georgia}.setting{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.toggle{width:48px;height:27px;border-radius:20px;background:#bbb;border:0}.toggle.on{background:var(--red)}.modal{position:fixed;inset:0;background:#0007;z-index:40;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#fff;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}.empty{text-align:center;padding:30px;color:var(--muted)}
body.dark #app{background:#151214;color:#f6eef0}body.dark .card,body.dark .sheet,body.dark .nav,body.dark .search,body.dark .textarea{background:#211c1e;color:#f6eef0;border-color:#3d3034}body.dark .playerInfo small,body.dark .empty{color:#b9aaaf}
.splash.hide{opacity:0;pointer-events:none;transition:opacity .25s}.splash{transition:opacity .25s}
</style>
</head>
<body>
<div class="splash" id="splash"><div><div class="crest"><b>FCM</b></div><p>FC MÜNCHEN</p></div></div>
<div id="app"></div>
<script>
const players=[
["Unai Simón","GK","🇪🇸"],["Jonas Urbig","GK","🇩🇪"],
["Nathaniel Brown","DF","🇩🇪"],["Antonio Rüdiger","DF","🇩🇪"],["Federico Gatti","DF","🇮🇹"],["Josip Stanišić","DF","🇭🇷"],["Jorrel Hato","DF","🇳🇱"],["Jurriën Timber","DF","🇳🇱"],["Jonathan Tah","DF","🇩🇪"],
["Casemiro","MF","🇧🇷"],["Aleksandar Pavlović","MF","🇩🇪"],["James Maddison","MF","🏴"],["Douglas Luiz","MF","🇧🇷"],["Konrad Laimer","MF","🇦🇹"],["João Palhinha","MF","🇵🇹"],["Joshua Kimmich","MF","🇩🇪"],
["Mohamed Salah","FW","🇪🇬"],["Luis Díaz","FW","🇨🇴"],["Matheus Cunha","FW","🇧🇷"],["Deniz Undav","FW","🇩🇪"],["Thomas Müller","FW","🇩🇪"],["Dejan Kulusevski","FW","🇸🇪"],["Lennart Karl","FW","🇩🇪"],["Ousmane Dembélé","FW","🇫🇷"],["Ferran Torres","FW","🇪🇸"]
];
let appData={};
try{appData=JSON.parse(localStorage.getItem("fcm-data")||"{}")}catch(e){appData={}}
const state={page:"home",dark:!!appData.dark, captain:"Mohamed Salah",vice:"Thomas Müller",third:"Casemiro",
 transfers:appData.transfers||[], finances:appData.finances||[], news:appData.news||[], records:appData.records||{}};
function save(){try{localStorage.setItem("fcm-data",JSON.stringify({...state,dark:state.dark}))}catch(e){}}
function initials(n){return n.split(" ").map(x=>x[0]).join("").slice(0,3).toUpperCase()}
function playerCard(p){
 const [n,pos,flag]=p; let r=state.records[n]||{apps:0,goals:0,assists:0};
 return `<div class="card player" onclick="profile('${n.replace(/'/g,"\\'")}')"><div class="playerPic">${initials(n)}</div><div class="playerInfo"><b>${n}</b><small>${pos} · ${flag}</small></div><div class="num">#</div></div>`
}
function render(){
 document.body.classList.toggle("dark",state.dark);
 let html=top();
 if(state.page==="home") html+=home();
 if(state.page==="squad") html+=squad();
 if(state.page==="transfers") html+=transfers();
 if(state.page==="finance") html+=finance();
 if(state.page==="news") html+=news();
 if(state.page==="more") html+=more();
 html+=nav(); document.getElementById("app").innerHTML=html;
}
function top(){return `<header class="top"><div class="brand"><div class="mini">FCM</div><div><h1>FC MÜNCHEN</h1><small>00-01 SEASON</small></div></div><span>🔴</span></header>`}
function home(){let main=state.news.find(n=>n.main)||state.news[0];return `<main class="content">
<div class="hero"><div class="heroText"><strong>FC MÜNCHEN</strong><span>POP ARENA · 60,000</span></div></div>
<div class="section"><div class="sectionTitle"><h2>구단 홈</h2><span class="pill">00-01 SEASON</span></div>
<div class="card"><div class="row"><b>감독</b><span>👔 프로필은 더보기에서</span></div><hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><div class="row"><b>주장</b><span>${state.captain}</span></div><div class="row" style="margin-top:8px"><b>부주장</b><span>${state.vice}</span></div></div></div>
<div class="section"><div class="sectionTitle"><h2>📰 주요 뉴스</h2></div>${main?`<div class="newsMain"><span class="pill">MAIN NEWS</span><h2>${main.title}</h2><p>${main.body||""}</p></div>`:`<div class="card empty">등록된 뉴스가 없습니다.</div>`}</div>
</main>`}
function squad(){return `<main class="content"><div class="sectionTitle"><h2>👥 선수단</h2><span class="pill">${players.length}명</span></div><input class="search" id="search" placeholder="선수 이름 검색" oninput="filterPlayers(this.value)"><div id="playerList">${players.map(playerCard).join("")}</div></main>`}
function filterPlayers(q){let list=players.filter(p=>p[0].toLowerCase().includes(q.toLowerCase()));document.getElementById("playerList").innerHTML=list.length?list.map(playerCard).join(""):`<div class="empty">검색 결과가 없습니다.</div>`}
function profile(name){let p=players.find(x=>x[0]===name),r=state.records[name]||{apps:0,goals:0,assists:0};document.body.insertAdjacentHTML("beforeend",`<div class="modal show" id="profileModal"><div class="sheet"><button class="close" onclick="this.closest('.modal').remove()">×</button><div class="profile"><div class="profilePic">${initials(name)}</div><h2>${name}</h2><span class="pill">${p[1]} · ${p[2]}</span><h3>경기 기록</h3><div class="grid2"><div class="card"><b>출전</b><div class="bigMoney" style="font-size:25px">${r.apps}</div><button class="btn" onclick="changeRec('${name}', 'apps')">+1</button></div><div class="card"><b>골</b><div class="bigMoney" style="font-size:25px">${r.goals}</div><button class="btn" onclick="changeRec('${name}', 'goals')">+1</button></div><div class="card"><b>도움</b><div class="bigMoney" style="font-size:25px">${r.assists}</div><button class="btn" onclick="changeRec('${name}', 'assists')">+1</button></div></div></div></div></div>`)}
function changeRec(name,k){let r=state.records[name]||{apps:0,goals:0,assists:0};r[k]++;state.records[name]=r;save();document.getElementById("profileModal").remove();profile(name)}
function transfers(){return `<main class="content"><div class="sectionTitle"><h2>🔄 이적시장</h2></div><div class="card"><h3>🟢 영입</h3>${state.transfers.filter(x=>x.type==="in").map((x,i)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${x.name}</span><b class="green">€${x.fee}M</b></div>`).join("")||`<div class="empty">영입 기록이 없습니다.</div>`}</div><div class="card"><h3>🔴 방출</h3>${state.transfers.filter(x=>x.type==="out").map((x,i)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${x.name}</span><b class="red">€${x.fee}M</b></div>`).join("")||`<div class="empty">방출 기록이 없습니다.</div>`}</div><button class="btn" onclick="transferModal()">+ 이적 기록 추가</button></main>`}
function transferModal(){document.body.insertAdjacentHTML("beforeend",`<div class="modal show" id="tm"><div class="sheet"><button class="close" onclick="this.closest('.modal').remove()">×</button><h2>이적 기록 추가</h2><select id="tt" class="search"><option value="in">영입</option><option value="out">방출</option></select><input id="tn" class="search" placeholder="선수 이름"><input id="tf" class="search" type="number" step="0.1" placeholder="이적료 (€M)"><button class="btn" onclick="addTransfer()">저장</button></div></div>`)}
function addTransfer(){let x={type:tt.value,name:tn.value,fee:tf.value};if(!x.name)return;state.transfers.push(x);save();document.getElementById("tm").remove();render()}
function finance(){let income=state.finances.filter(x=>x.amount>0).reduce((a,x)=>a+Number(x.amount),0),out=state.finances.filter(x=>x.amount<0).reduce((a,x)=>a+Math.abs(Number(x.amount)),0),balance=100+income-out;return `<main class="content"><div class="sectionTitle"><h2>💰 구단 재정</h2></div><div class="card"><small>현재 잔고</small><div class="bigMoney">€${balance.toFixed(1)}M</div><div class="grid2"><div><small>총수입</small><b class="green">€${income.toFixed(1)}M</b></div><div><small>총지출</small><b class="red">€${out.toFixed(1)}M</b></div></div></div><div class="card"><div class="row"><b>최근 재정 기록</b><button class="btn" onclick="financeModal()">+ 추가</button></div>${state.finances.map((x,i)=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${x.text}</span><span><b class="${x.amount>=0?'green':'red'}">${x.amount>=0?'+':''}€${Math.abs(x.amount)}M</b> <button class="btn danger" onclick="delFin(${i})">🗑️</button></span></div>`).join("")||`<div class="empty">기록이 없습니다.</div>`}</div></main>`}
function financeModal(){document.body.insertAdjacentHTML("beforeend",`<div class="modal show" id="fm"><div class="sheet"><button class="close" onclick="this.closest('.modal').remove()">×</button><h2>재정 기록 추가</h2><input id="ft" class="search" placeholder="내용"><input id="fa" class="search" type="number" step="0.1" placeholder="금액 (€M) · 지출은 - 입력"><button class="btn" onclick="addFin()">저장</button></div></div>`)}
function addFin(){if(!ft.value||!fa.value)return;state.finances.push({text:ft.value,amount:Number(fa.value)});save();document.getElementById("fm").remove();render()}
function delFin(i){state.finances.splice(i,1);save();render()}
function news(){let main=state.news.find(n=>n.main);return `<main class="content"><div class="sectionTitle"><h2>📰 뉴스</h2><button class="btn" onclick="newsModal()">+ 작성</button></div>${main?`<div class="newsMain"><span class="pill">MAIN NEWS</span><h2>${main.title}</h2><p>${main.body}</p><button class="btn gold" onclick="setMain(${state.news.indexOf(main)})">메인 유지</button></div>`:`<div class="card empty">메인 뉴스가 없습니다.</div>`}<div class="section">${state.news.map((n,i)=>`<div class="card"><span class="pill">${n.short?'속보':'NEWS'}</span><h3>${n.title}</h3><p>${n.body||""}</p><div class="row"><button class="btn light" onclick="editNews(${i})">수정</button><div><button class="btn" onclick="setMain(${i})">메인 지정</button> <button class="btn danger" onclick="delNews(${i})">삭제</button></div></div></div>`).join("")}</div></main>`}
function newsModal(i=null){let n=i==null?{title:"",body:"",short:false}:state.news[i];document.body.insertAdjacentHTML("beforeend",`<div class="modal show" id="nm"><div class="sheet"><button class="close" onclick="this.closest('.modal').remove()">×</button><h2>${i==null?"뉴스 작성":"뉴스 수정"}</h2><input id="nt" class="search" value="${n.title}" placeholder="제목"><textarea id="nb" class="textarea" placeholder="내용">${n.body}</textarea><label><input id="ns" type="checkbox" ${n.short?"checked":""}> 짧은 속보</label><br><br><button class="btn" onclick="saveNews(${i==null?-1:i})">저장</button></div></div>`)}
function saveNews(i){let n={title:nt.value,body:nb.value,short:ns.checked,main:false};if(!n.title)return;if(i<0)state.news.unshift(n);else{n.main=state.news[i].main;state.news[i]=n}save();document.getElementById("nm").remove();render()}
function editNews(i){newsModal(i)} function setMain(i){state.news.forEach((n,j)=>n.main=j===i);save();render()} function delNews(i){state.news.splice(i,1);save();render()}
function more(){return `<main class="content"><div class="sectionTitle"><h2>☰ 더보기</h2></div><div class="card"><button class="setting" style="width:100%;border:0;background:none" onclick="manager()"><span>👔 감독 프로필</span><b>›</b></button><button class="setting" style="width:100%;border:0;background:none" onclick="captains()"><span>🏅 주장단 관리</span><b>›</b></button><button class="setting" style="width:100%;border:0;background:none" onclick="settings()"><span>⚙️ 사이트 설정</span><b>›</b></button></div></main>`}
function manager(){document.body.insertAdjacentHTML("beforeend",`<div class="modal show"><div class="sheet"><button class="close" onclick="this.closest('.modal').remove()">×</button><div class="profile"><div class="profilePic">👔</div><h2>FC München 감독</h2><span class="pill">🇩🇪 독일</span></div></div></div>`)}
function captains(){document.body.insertAdjacentHTML("beforeend",`<div class="modal show"><div class="sheet"><button class="close" onclick="this.closest('.modal').remove()">×</button><h2>🏅 주장단</h2><p>주장: <b>${state.captain}</b></p><p>부주장: <b>${state.vice}</b></p><p>3주장: <b>${state.third}</b></p><button class="btn" onclick="captainEdit()">주장단 변경</button></div></div>`)}
function captainEdit(){document.querySelectorAll(".modal").forEach(x=>x.remove());document.body.insertAdjacentHTML("beforeend",`<div class="modal show"><div class="sheet"><button class="close" onclick="this.closest('.modal').remove()">×</button><h2>주장단 변경</h2>${["captain","vice","third"].map((k,i)=>`<label>${["주장","부주장","3주장"][i]}<select id="${k}" class="search">${players.map(p=>`<option ${state[k]===p[0]?"selected":""}>${p[0]}</option>`).join("")}</select></label>`).join("")}<button class="btn" onclick="saveCaptains()">저장</button></div></div>`)}
function saveCaptains(){state.captain=captain.value;state.vice=vice.value;state.third=third.value;save();document.querySelectorAll(".modal").forEach(x=>x.remove());render()}
function settings(){document.body.insertAdjacentHTML("beforeend",`<div class="modal show"><div class="sheet"><button class="close" onclick="this.closest('.modal').remove()">×</button><h2>⚙️ 사이트 설정</h2><div class="setting"><span>다크 모드</span><button class="toggle ${state.dark?"on":""}" onclick="state.dark=!state.dark;save();this.classList.toggle('on');document.body.classList.toggle('dark',state.dark)">●</button></div></div></div>`)}
function nav(){let items=[["home","🏠","홈"],["squad","👥","선수단"],["transfers","🔄","이적"],["finance","💰","재정"],["news","📰","뉴스"],["more","☰","더보기"]];return `<nav class="nav">${items.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="state.page='${x[0]}';render()"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>`}
window.addEventListener("DOMContentLoaded",()=>{
 try{render()}catch(e){console.error(e)}
 setTimeout(()=>{const x=document.getElementById("splash");if(x)x.classList.add("hide")},1200)
});
</script>
</body>
</html>
